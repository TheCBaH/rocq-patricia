name: patricia

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install opam and ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends opam ripgrep

      - name: Set up opam switch
        run: |
          opam init --bare --disable-sandboxing -y
          opam switch create patricia 4.14.3
          echo "$(opam var bin)" >> "$GITHUB_PATH"

      - name: Install Rocq
        run: opam install -y rocq-core.9.2.0 rocq-stdlib.9.1.0

      - name: Proof, extraction, and functional tests
        run: >-
          make
          ROCQ=rocq OCAMLC=ocamlc OCAMLOPT=ocamlopt OCAMLDEP=ocamldep

      - name: Native specialized-union oracle
        run: >-
          make union-oracle-native
          ROCQ=rocq OCAMLC=ocamlc OCAMLOPT=ocamlopt OCAMLDEP=ocamldep

      - name: Hash-table proof and reference checks
        run: >-
          make hashtable
          ROCQ=rocq OCAMLC=ocamlc OCAMLOPT=ocamlopt OCAMLDEP=ocamldep

      - name: Hash-table checked benchmark smoke test
        run: >-
          make hashtable-benchmark-smoke
          ROCQ=rocq OCAMLC=ocamlc OCAMLOPT=ocamlopt OCAMLDEP=ocamldep

      - name: Checked benchmark smoke test
        run: >-
          make benchmark-smoke
          ROCQ=rocq OCAMLC=ocamlc OCAMLOPT=ocamlopt OCAMLDEP=ocamldep

  verify-dune:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install opam and ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends opam ripgrep

      - name: Set up opam switch
        run: |
          opam init --bare --disable-sandboxing -y
          opam switch create patricia 4.14.3
          echo "$(opam var bin)" >> "$GITHUB_PATH"

      - name: Install Rocq and dune
        run: opam install -y rocq-core.9.2.0 rocq-stdlib.9.1.0 dune

      - name: Dune build and test
        run: dune build @runtest
