name: patricia

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14.3"

      - name: Install Rocq and dune
        run: opam install rocq-core.9.2.0 rocq-stdlib.9.2.0 dune

      - name: Install ripgrep
        run: sudo apt-get install -y --no-install-recommends ripgrep

      - name: Dune build and test
        run: opam exec -- dune build @runtest

      - name: Proof, extraction, and functional tests
        run: >-
          opam exec -- make
          ROCQ=rocq OCAMLC=ocamlc OCAMLOPT=ocamlopt OCAMLDEP=ocamldep

      - name: Native specialized-union oracle
        run: >-
          opam exec -- make union-oracle-native
          ROCQ=rocq OCAMLC=ocamlc OCAMLOPT=ocamlopt OCAMLDEP=ocamldep

      - name: Hash-table proof and reference checks
        run: >-
          opam exec -- make hashtable
          ROCQ=rocq OCAMLC=ocamlc OCAMLOPT=ocamlopt OCAMLDEP=ocamldep

      - name: Hash-table checked benchmark smoke test
        run: >-
          opam exec -- make hashtable-benchmark-smoke
          ROCQ=rocq OCAMLC=ocamlc OCAMLOPT=ocamlopt OCAMLDEP=ocamldep

      - name: Checked benchmark smoke test
        run: >-
          opam exec -- make benchmark-smoke
          ROCQ=rocq OCAMLC=ocamlc OCAMLOPT=ocamlopt OCAMLDEP=ocamldep
